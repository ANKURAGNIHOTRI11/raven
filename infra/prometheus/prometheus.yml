global:
  scrape_interval: 15s
  external_labels: {platform: raven}

scrape_configs:
  - job_name: raven-workers
    static_configs:
      - targets:
          - crawler:9100
          - normalizer:9100
          - graph-builder:9100
          - gnn-engine:9100
          - risk-engine:9100
          - agents:9100
          - remediation:9100
          - feedback:9100
  - job_name: raven-http
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000, llm-gateway:8000, sandbox:8090]
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: [vllm:8000]
