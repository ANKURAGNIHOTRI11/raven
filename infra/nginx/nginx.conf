# Front door. TLS terminates here; in production put your own certificate in
# /etc/nginx/certs and switch the console listener to 8443.

#upstream raven_api     { server api:8000; }
#upstream raven_grafana { server grafana:3000; }

resolver 127.0.0.11 valid=10s;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 8088;
    server_name _;

    client_max_body_size 8m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    location / {
#        proxy_pass http://raven_api;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /grafana/ {
#        proxy_pass http://raven_grafana/;
        set $grafana_upstream grafana:3000;
        proxy_pass http://$grafana_upstream/;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 8443;
    server_name _;
    # ssl_certificate     /etc/nginx/certs/raven.crt;
    # ssl_certificate_key /etc/nginx/certs/raven.key;
    location / { return 301 http://$host:8088$request_uri; }
}
