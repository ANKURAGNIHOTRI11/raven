name: EPIC-01 enrichment tests

on:
  pull_request:
    branches: [main]
    paths:
      - "services/enrichment_worker/**"
      - "tests/test_enrichment_worker.py"
      - "libs/raven_common/**"
      - ".github/workflows/epic01-tests.yml"
  push:
    branches: [epic01/cve-metadata-enrichment]

permissions:
  contents: read

jobs:
  enrichment-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest httpx asyncpg pydantic-settings
      - name: Run EPIC-01 enrichment tests
        run: python -m pytest -q tests/test_enrichment_worker.py
