name: Raven CI

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./libs/raven_common pytest torch-geometric==2.6.1
      - name: Run unit and regression tests
        env:
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q libs services deploy tests
      - name: Generate and validate test environment
        run: |
          python deploy/init_env.py
          python deploy/validate_env.py .env
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
