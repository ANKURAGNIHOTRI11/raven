<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAVEN — exposure console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================== tokens ============================== */
:root{
  --ground:#eef0f2; --ground-2:#e4e7ea; --panel:#fbfbfc; --panel-2:#f2f3f5;
  --ink:#12181f; --ink-soft:#5c6a76; --ink-faint:#8b97a1;
  --rule:#d6dbe0; --rule-soft:#e6e9ec;
  --signal:#c4351a; --signal-soft:#f3ddd6;
  --chain:#0b6b6b; --chain-soft:#d9ecea;
  --hold:#946117; --hold-soft:#f2e5cf;
  --ok:#256c39; --ok-soft:#dbe9dc;
  --accent:#3454d1; --accent-soft:#e1e7fb;
  --shadow-1:0 1px 2px rgba(18,24,31,.06);
  --shadow-2:0 6px 20px -6px rgba(18,24,31,.16);
  --shadow-3:0 24px 56px -14px rgba(18,24,31,.30);
  --glow-signal:0 0 0 1px color-mix(in srgb, var(--signal) 35%, transparent), 0 8px 26px -10px color-mix(in srgb, var(--signal) 45%, transparent);
  --glow-chain:0 0 0 1px color-mix(in srgb, var(--chain) 30%, transparent), 0 8px 26px -10px color-mix(in srgb, var(--chain) 40%, transparent);
  --radius-s:7px; --radius-m:11px; --radius-l:18px;
  --ease:cubic-bezier(.16,.84,.44,1);
  --ease-snap:cubic-bezier(.2,.9,.25,1.2);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --dur-1:150ms; --dur-2:300ms; --dur-3:560ms;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0a0d11; --ground-2:#0d1115; --panel:#12171d; --panel-2:#161c23;
    --ink:#e8edf1; --ink-soft:#93a2ad; --ink-faint:#5c6b78;
    --rule:#232c34; --rule-soft:#1a222a;
    --signal:#ea6b4d; --signal-soft:rgba(234,107,77,.14);
    --chain:#3fc2bb; --chain-soft:rgba(63,194,187,.14);
    --hold:#e3b155; --hold-soft:rgba(227,177,85,.14);
    --ok:#6ecb82; --ok-soft:rgba(110,203,130,.14);
    --accent:#7d9bff; --accent-soft:rgba(125,155,255,.14);
    --shadow-1:0 1px 2px rgba(0,0,0,.35);
    --shadow-2:0 10px 30px -8px rgba(0,0,0,.6);
    --shadow-3:0 34px 80px -18px rgba(0,0,0,.75);
    --glow-signal:0 0 0 1px rgba(234,107,77,.4), 0 10px 30px -10px rgba(234,107,77,.35);
    --glow-chain:0 0 0 1px rgba(63,194,187,.35), 0 10px 30px -10px rgba(63,194,187,.3);
  }
}
:root[data-theme="dark"]{ color-scheme: dark; }

*{box-sizing:border-box}
::selection{background:var(--accent);color:#fff}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:14.5px; line-height:1.5;
  overflow:hidden;
  background-image:
    radial-gradient(circle at 12% -8%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 42%),
    radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--chain) 7%, transparent), transparent 46%),
    radial-gradient(circle at 55% 110%, color-mix(in srgb, var(--signal) 5%, transparent), transparent 40%);
  background-attachment:fixed;
}
code,.mono,td.num,.count{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-faint)}
*{scrollbar-color:var(--rule) transparent;scrollbar-width:thin}

header{
  position:relative; z-index:20;
  display:flex; align-items:center; gap:1.4rem; flex-wrap:wrap;
  height:60px; padding:0 1.5rem;
  background:color-mix(in srgb, var(--panel) 84%, transparent);
  backdrop-filter:blur(16px) saturate(1.4);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid var(--rule);
  box-shadow:var(--shadow-1);
}
.brand{display:flex;align-items:center;gap:.6rem}
.brand .mark{
  width:27px;height:27px;border-radius:8px;flex:none;
  background:linear-gradient(155deg,var(--ink) 0%,var(--ink) 42%,var(--signal) 135%);
  display:grid;place-items:center;color:var(--panel);font-weight:800;font-size:.74rem;
  box-shadow:var(--shadow-1), inset 0 0 0 1px rgba(255,255,255,.1);
  transition:transform var(--dur-2) var(--ease-spring);
}
.brand:hover .mark{transform:rotate(-6deg) scale(1.06)}
header h1{font-size:1.04rem;font-weight:800;letter-spacing:-.01em;margin:0}
header .tagline{margin:0;color:var(--ink-soft);font-size:.78rem;display:none}
@media(min-width:640px){header .tagline{display:block}}
header .spacer{flex:1}
.livepill{
  display:flex;align-items:center;gap:.45rem;font-size:.72rem;color:var(--ink-soft);
  padding:.32rem .65rem;border:1px solid var(--rule);border-radius:99px;background:var(--panel-2);
  transition:box-shadow var(--dur-2) var(--ease);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);position:relative;flex:none;transition:background var(--dur-2) var(--ease)}
.dot.live{background:var(--ok)}
.dot.live::after{
  content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--ok);opacity:.5;
  animation:pulse-ring 1.8s var(--ease) infinite;
}
@keyframes pulse-ring{0%{transform:scale(.5);opacity:.55}100%{transform:scale(2.2);opacity:0}}

input,button,select{font:inherit;color:inherit}
input[type=password],input[type=text]{
  background:var(--panel-2);border:1px solid var(--rule);border-radius:var(--radius-s);
  padding:.44rem .65rem;width:14rem;transition:border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
}
input:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
button{
  background:var(--ink);color:var(--panel);border:0;border-radius:var(--radius-s);
  padding:.46rem .95rem;cursor:pointer;font-weight:600;font-size:.85rem;
  transition:transform var(--dur-1) var(--ease-snap), box-shadow var(--dur-1) var(--ease), filter var(--dur-1) var(--ease), background var(--dur-1) var(--ease);
}
button:hover{filter:brightness(1.14);box-shadow:var(--shadow-2)}
button:active{transform:translateY(1px) scale(.97)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);box-shadow:none}
button.ghost:hover{background:var(--panel-2);border-color:var(--ink-faint);filter:none}
button.approve:hover{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
button.reject:hover{background:var(--signal-soft);color:var(--signal);border-color:var(--signal)}
button:focus-visible,input:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

main{
  display:grid; grid-template-columns:16rem minmax(0,1fr) 27rem;
  height:calc(100dvh - 60px);
  background:var(--rule);
  gap:1px;
}
main>section{background:var(--ground);padding:1.3rem 1.4rem 3rem;overflow-y:auto;min-width:0;position:relative}
@media (max-width:1240px){ main{grid-template-columns:14rem minmax(0,1fr)} .detail{display:none} }
@media (max-width:820px){ main{grid-template-columns:1fr} .rail{display:none} }

.rail h2,.detail h2,.board h2{
  font-size:.72rem;font-weight:700;color:var(--ink-faint);margin:0 0 .65rem;
  text-transform:uppercase;letter-spacing:.08em;
}
.rail .block{margin-bottom:1.6rem;animation:rise var(--dur-3) var(--ease) backwards}
.rail .block:nth-child(2){animation-delay:40ms}
.rail .block:nth-child(3){animation-delay:80ms}

.stage{
  display:flex;justify-content:space-between;align-items:center;gap:.5rem;
  padding:.52rem .35rem;border-bottom:1px solid var(--rule-soft);border-radius:6px;
  transition:background var(--dur-1) var(--ease), padding-left var(--dur-1) var(--ease);
}
.stage:hover{background:var(--panel-2);padding-left:.55rem}
.stage:last-child{border-bottom:0}
.stage .k{display:flex;align-items:center;gap:.45rem;color:var(--ink-soft);font-size:.82rem}
.stage b{font-weight:700;font-size:.86rem}

.headline{
  display:flex;align-items:flex-end;gap:1.2rem;margin-bottom:1.3rem;flex-wrap:wrap;
  padding-bottom:1.2rem;border-bottom:1px solid var(--rule);
}
.headline .count{
  font-size:3.7rem;line-height:.88;font-weight:800;letter-spacing:-.035em;
  background:linear-gradient(160deg,var(--ink), color-mix(in srgb, var(--ink) 55%, var(--ink-soft)));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  transition:filter var(--dur-2) var(--ease);
}
.headline .count.alarm{background:linear-gradient(160deg,var(--signal), color-mix(in srgb, var(--signal) 55%, var(--hold)));-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 18px color-mix(in srgb, var(--signal) 35%, transparent))}
.headline p{margin:0;max-width:36rem;color:var(--ink-soft);font-size:.9rem}

.tabs{display:flex;gap:1.3rem;margin-bottom:1rem;border-bottom:1px solid var(--rule);position:relative}
.tabs button{
  background:none;color:var(--ink-faint);border:0;padding:.55rem .05rem;border-radius:0;box-shadow:none;
  font-weight:600;font-size:.86rem;position:relative;transition:color var(--dur-2) var(--ease);
}
.tabs button:hover{color:var(--ink-soft);filter:none}
.tabs button[aria-current=true]{color:var(--ink)}
.tab-indicator{
  position:absolute;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--signal),var(--chain));border-radius:2px;
  transition:left var(--dur-2) var(--ease-snap), width var(--dur-2) var(--ease-snap);
}
.boardhead{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.2rem}
.expandall{font-size:.76rem}

.tablewrap{animation:rise var(--dur-3) var(--ease)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.86rem}
th{
  text-align:left;font-weight:600;color:var(--ink-faint);font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;
  padding:.5rem .6rem;border-bottom:1px solid var(--rule);position:sticky;top:-1.3rem;background:var(--ground);z-index:1;
}
td{padding:.55rem .6rem;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
tbody tr.finding-row{
  cursor:pointer;border-left:2px solid transparent;
  transition:background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
  animation:rowin var(--dur-2) var(--ease) backwards;
}
tbody tr.finding-row:hover{background:var(--panel);transform:translateX(2px)}
tbody tr.finding-row[aria-selected=true]{background:var(--panel-2);border-left-color:var(--accent)}
tbody tr.band-critical,tbody tr.band-high{border-left-color:color-mix(in srgb, var(--signal) 45%, transparent)}
tbody tr[aria-selected=true].band-critical,tbody tr[aria-selected=true].band-high{border-left-color:var(--signal)}
td.num{text-align:right}

.expandbtn{
  width:22px;height:22px;border:1px solid var(--rule);background:var(--panel-2);border-radius:6px;
  display:grid;place-items:center;color:var(--ink-soft);padding:0;box-shadow:none;
  transition:transform var(--dur-2) var(--ease-spring), background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.expandbtn:hover{background:var(--panel);color:var(--ink);filter:none}
.expandbtn svg{width:11px;height:11px;transition:transform var(--dur-2) var(--ease-spring)}
tr.open .expandbtn svg{transform:rotate(90deg)}

tr.explain-row td{padding:0;border-bottom:1px solid var(--rule)}
.explain-collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur-3) var(--ease)}
tr.explain-row.show .explain-collapse{grid-template-rows:1fr}
.explain-collapse-inner{overflow:hidden}
.explain-pad{padding:.4rem 1.2rem 1.3rem 2.6rem;background:linear-gradient(180deg, var(--panel-2), var(--ground) 90%)}

.band{
  display:inline-flex;align-items:center;gap:.3rem;padding:.16rem .52rem;border-radius:99px;
  font-size:.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  transition:transform var(--dur-1) var(--ease-snap);
}
.band::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.band.critical,.band.high{color:var(--signal);background:var(--signal-soft);box-shadow:var(--glow-signal)}
.band.medium{color:var(--hold);background:var(--hold-soft)}
.band.low,.band.informational{color:var(--ink-soft);background:var(--panel-2)}

.scorebar{width:54px;height:5px;border-radius:3px;background:var(--rule-soft);overflow:hidden;margin-top:.32rem;margin-left:auto}
.scorebar i{display:block;height:100%;background:linear-gradient(90deg,var(--ink-faint),var(--ink-soft));border-radius:3px;width:0;transition:width var(--dur-3) var(--ease) .08s}
.scorebar.hot i{background:linear-gradient(90deg,var(--hold),var(--signal))}

.chainmark{color:var(--chain);font-weight:700}
.kevtag{
  display:inline-block;margin-left:.35rem;font-size:.62rem;font-weight:700;letter-spacing:.03em;
  padding:.09rem .34rem;border-radius:4px;background:var(--chain-soft);color:var(--chain);
  box-shadow:var(--glow-chain);
}
.flag{color:var(--hold);cursor:help}

.ledger{margin:.4rem 0 1.2rem}
.row{display:grid;grid-template-columns:9rem 1fr 3.4rem;align-items:center;gap:.55rem;padding:.26rem 0;font-size:.78rem}
.row .label{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:relative;height:7px;border-radius:4px;background:var(--panel-2);overflow:visible}
.bar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--rule)}
.bar i{position:absolute;top:0;height:100%;display:block;border-radius:4px;width:0!important;transition:width var(--dur-3) var(--ease)}
.bar i.up{left:50%;background:linear-gradient(90deg,color-mix(in srgb,var(--signal) 60%,transparent),var(--signal));border-radius:0 4px 4px 0}
.bar i.down{right:50%;background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 60%,transparent));border-radius:4px 0 0 4px}
.row .val{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink-soft)}

.detail{position:relative}
.detailbody{animation:fadeswap var(--dur-2) var(--ease)}
@keyframes fadeswap{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius-m);
  padding:.95rem 1.05rem;margin-bottom:1rem;box-shadow:var(--shadow-1);
  transition:box-shadow var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease);
}
.card:hover{box-shadow:var(--shadow-2)}
.detail dl{display:grid;grid-template-columns:7.4rem 1fr;gap:.35rem .8rem;margin:0;font-size:.83rem}
.detail dt{color:var(--ink-faint);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding-top:.1rem}
.detail dd{margin:0}

.flow{display:flex;flex-wrap:wrap;align-items:center;gap:0;margin-bottom:.5rem;font-family:"IBM Plex Mono",monospace;font-size:.74rem}
.flow .node{padding:.3rem .58rem;background:var(--panel-2);border:1px solid var(--rule);border-radius:6px;transition:background var(--dur-1) var(--ease)}
.flow .arrow{color:var(--ink-faint);padding:0 .32rem;position:relative;width:1.1rem;text-align:center}
.flow .arrow::after{content:"→"}
.pathcard{
  border-left:3px solid var(--chain);background:var(--chain-soft);border-radius:0 var(--radius-s) var(--radius-s) 0;
  padding:.65rem .75rem;margin-bottom:.55rem;transition:transform var(--dur-1) var(--ease)
}
.pathcard:hover{transform:translateX(2px)}
.pathmeta{display:flex;gap:.9rem;margin-top:.32rem;font-size:.72rem;color:var(--ink-soft)}

.rationale{
  white-space:pre-wrap;font-size:.8rem;background:var(--panel-2);padding:.75rem;
  border:1px solid var(--rule);border-radius:var(--radius-s);max-height:15rem;overflow:auto;line-height:1.6;
}
.actions{display:flex;gap:.6rem;margin-top:.9rem}
.empty{color:var(--ink-faint);font-size:.86rem;padding:1.4rem 0;text-align:center}

/* ---------------- explainer (what / impact / patch) ---------------- */
.explainer{display:flex;flex-direction:column;gap:.7rem}
.xcard{
  border:1px solid var(--rule);border-radius:var(--radius-m);background:var(--panel);
  overflow:hidden;box-shadow:var(--shadow-1);
  animation:rise var(--dur-2) var(--ease) backwards;
}
.xcard + .xcard{animation-delay:60ms}
.xcard-head{display:flex;align-items:center;gap:.55rem;padding:.65rem .85rem;border-bottom:1px solid var(--rule-soft);background:var(--panel-2)}
.xicon{
  width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;
  color:#fff;font-size:.72rem;font-weight:800;
}
.xicon.what{background:linear-gradient(155deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#000))}
.xicon.impact{background:linear-gradient(155deg,var(--signal),color-mix(in srgb,var(--signal) 60%,#000))}
.xicon.patch{background:linear-gradient(155deg,var(--ok),color-mix(in srgb,var(--ok) 60%,#000))}
.xcard-head span{font-weight:700;font-size:.82rem}
.xcard-body{padding:.8rem .9rem .9rem}
.xtext{font-size:.83rem;color:var(--ink);line-height:1.65;margin:0 0 .3rem}
.xsteps{list-style:none;margin:.35rem 0 0;padding:0;counter-reset:xstep}
.xsteps li{
  counter-increment:xstep;position:relative;padding:.4rem 0 .4rem 2.1rem;font-size:.82rem;line-height:1.55;
  border-top:1px dashed var(--rule-soft);
}
.xsteps li:first-child{border-top:0}
.xsteps li::before{
  content:counter(xstep);position:absolute;left:0;top:.4rem;width:1.5rem;height:1.5rem;border-radius:7px;
  background:var(--panel-2);border:1px solid var(--rule);display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:.68rem;font-weight:700;color:var(--ink-soft);
}
.xtag{
  display:inline-flex;align-items:center;gap:.3rem;font-size:.66rem;font-weight:700;letter-spacing:.02em;
  padding:.14rem .5rem;border-radius:99px;background:var(--hold-soft);color:var(--hold);margin-left:auto;
  text-transform:uppercase;
}
.xnote{font-size:.72rem;color:var(--ink-faint);margin-top:.5rem;font-style:italic}
.xurgent{border-color:color-mix(in srgb, var(--signal) 40%, var(--rule));box-shadow:var(--glow-signal)}

.skel-row{height:2.1rem;border-radius:6px;margin-bottom:.4rem;background:linear-gradient(100deg,var(--panel-2) 30%,var(--rule-soft) 50%,var(--panel-2) 70%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{0%{background-position:150% 0}100%{background-position:-50% 0}}

#toastwrap{position:fixed;bottom:1.2rem;right:1.2rem;z-index:50;display:flex;flex-direction:column;gap:.5rem;align-items:flex-end}
.toast{
  background:var(--ink);color:var(--panel);padding:.65rem 1rem;border-radius:var(--radius-s);
  box-shadow:var(--shadow-3);font-size:.84rem;max-width:22rem;
  animation:toastin var(--dur-2) var(--ease-snap);
}
.toast.out{animation:toastout var(--dur-2) var(--ease) forwards}
@keyframes toastin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(6px) scale(.97)}}

@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rowin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .dot.live::after{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="mark">R</span>
    <h1>RAVEN</h1>
  </div>
  <p class="tagline">Exposure intelligence for the estate</p>
  <span class="spacer"></span>
  <span class="livepill"><span class="dot" id="livedot"></span><span id="livetext">offline</span></span>
  <label class="mono" style="font-size:.78rem;color:var(--ink-soft);display:flex;align-items:center;gap:.5rem">token
    <input id="token" type="password" autocomplete="off" placeholder="bearer token">
  </label>
  <button id="connect">Connect</button>
</header>

<main>
  <section class="rail">
    <div class="block">
      <h2>Pipeline</h2>
      <div id="rail"></div>
    </div>
    <div class="block">
      <h2>Feeds</h2>
      <div id="feeds"></div>
    </div>
    <div class="block">
      <h2>Model trust</h2>
      <div id="trust"></div>
    </div>
  </section>

  <section class="board">
    <div class="headline">
      <span class="count" id="hero">—</span>
      <p id="heroText">Connect with your API token to load the queue.</p>
    </div>
    <div class="boardhead">
      <div class="tabs" role="tablist">
        <button data-view="all" aria-current="true">Scored findings</button>
        <button data-view="chains">Exploit chains</button>
        <button data-view="queue">Awaiting approval</button>
        <button data-view="quarantine">Quarantine</button>
        <span class="tab-indicator" id="tabIndicator"></span>
      </div>
      <button class="ghost expandall" id="expandAll" title="Expand explanations for every row">Explain all ▾</button>
    </div>
    <div id="board"><p class="empty">Nothing loaded yet.</p></div>
  </section>

  <section class="detail" id="detail">
    <h2>Detail</h2>
    <p class="empty">Select a row to see why it scored the way it did, how it could affect your systems, and how to patch it.</p>
  </section>
</main>

<div id="toastwrap"></div>

<script>
const $ = s => document.querySelector(s);
let token = sessionStorage.getItem("raven_token") || "";
let view = "all";
let selected = null;
const detailCache = new Map(); // key: cve|asset -> full /api/finding response

function fmt(n, d = 1) { return (n === null || n === undefined) ? "—" : Number(n).toFixed(d); }
function esc(s) { return String(s ?? "").replace(/</g, "&lt;"); }

function countUp(el, target, opts = {}) {
  const from = Number(el.dataset.val || 0);
  const to = Number(target) || 0;
  el.dataset.val = to;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || from === to) { el.textContent = to; return; }
  const dur = opts.dur || 480, start = performance.now();
  function step(t) {
    const p = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * eased);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function toast(msg) {
  const wrap = $("#toastwrap");
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 300); }, 3400);
}

function moveTabIndicator(btn) {
  const ind = $("#tabIndicator");
  if (!btn || !ind) return;
  ind.style.left = btn.offsetLeft + "px";
  ind.style.width = btn.offsetWidth + "px";
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json", ...(options.headers || {}) }
  });
  if (res.status === 401) throw new Error("Token rejected. Check the value and connect again.");
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function loadOverview() {
  const o = await api("/api/overview");
  const c = o.counts;
  $("#livedot").classList.add("live");
  $("#livetext").textContent = "connected";

  $("#rail").innerHTML = [
    ["Vulnerabilities", c.vulnerabilities], ["Assets", c.assets],
    ["Open findings", c.open_findings], ["High or critical", c.elevated],
    ["Predicted chains", c.chains], ["Awaiting a person", c.pending_approvals],
    ["Abstained", c.abstentions], ["Quarantined records", c.quarantined],
  ].map(([k, v], i) => `<div class="stage"><span class="k">${k}</span><b class="mono" data-count="${i}">${v ?? 0}</b></div>`).join("");
  $("#rail").querySelectorAll("b[data-count]").forEach((el, i) => {
    const vals = [c.vulnerabilities, c.assets, c.open_findings, c.elevated, c.chains, c.pending_approvals, c.abstentions, c.quarantined];
    countUp(el, vals[i] ?? 0);
  });

  $("#feeds").innerHTML = o.sources.map(s => {
    const broken = s.circuit_open_until || s.consecutive_failures > 0;
    const okState = !broken && s.last_success;
    return `<div class="stage"><span class="k"><span class="dot ${okState ? "live" : ""}" style="${broken ? "background:var(--signal)" : ""}"></span>${s.source_id}</span>
      <b class="mono" ${broken ? 'style="color:var(--signal)"' : ""}>${
        s.circuit_open_until ? "breaker open" : (s.last_success ? s.accepted_records : "waiting")}</b></div>`;
  }).join("");

  $("#trust").innerHTML = o.model_trust.length
    ? o.model_trust.map(m => `<div class="stage"><span class="k">${m.model_name}</span><b class="mono">${fmt(m.trust_score, 2)}</b></div>`).join("")
    : `<p class="empty" style="padding:.6rem 0">No outcomes recorded yet.</p>`;

  const hero = $("#hero");
  hero.className = "count" + ((c.pending_approvals ?? 0) > 0 ? " alarm" : "");
  countUp(hero, c.pending_approvals ?? 0, { dur: 620 });
  $("#heroText").textContent = (c.pending_approvals ?? 0) === 0
    ? `Nothing is waiting on a person. ${c.chains ?? 0} predicted exploit chains are under watch.`
    : `changes are waiting for a decision. ${c.chains ?? 0} of the open findings sit on a predicted exploit chain, where no single CVE looks urgent on its own.`;
}

function findingsTable(data) {
  if (!data.length) return `<p class="empty">Nothing here yet. The pipeline fills this once the crawler and the graph engine have both run.</p>`;
  return `<div class="tablewrap"><table><thead><tr>
    <th style="width:2rem"></th><th>CVE</th><th>Asset</th><th>Env</th><th class="num">Risk</th><th>Band</th>
    <th class="num">Conf</th><th class="num">Chain</th><th class="num">Blast</th><th>Decision</th>
  </tr></thead><tbody>${data.map((r, i) => `
    <tr tabindex="0" class="finding-row band-${r.band}" style="animation-delay:${Math.min(i * 14, 260)}ms" data-cve="${r.cve_id}" data-asset="${r.asset_id}" aria-selected="false">
      <td><button class="expandbtn" data-explain-toggle title="Explain this vulnerability"><svg viewBox="0 0 12 12" fill="none"><path d="M4 2l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></td>
      <td class="mono">${r.cve_id}${r.kev ? '<span class="kevtag" title="CISA Known Exploited Vulnerabilities">KEV</span>' : ""}</td>
      <td>${r.hostname || r.asset_id}</td>
      <td>${r.environment ?? ""}</td>
      <td class="num">${fmt(r.fused_score)}<div class="scorebar ${r.fused_score >= 80 ? "hot" : ""}"><i data-w="${Math.min(100, r.fused_score || 0)}"></i></div></td>
      <td><span class="band ${r.band}">${r.band}</span></td>
      <td class="num">${fmt(r.confidence, 2)}</td>
      <td class="num ${r.chain_score > 0.25 ? "chainmark" : ""}">${fmt(r.chain_score, 2)}</td>
      <td class="num">${r.blast_radius ?? 0}</td>
      <td>${r.action ?? "—"}${r.adversarial_flag ? ' <span class="flag" title="Robustness monitor flagged this signal">⚑</span>' : ""}</td>
    </tr>
    <tr class="explain-row" data-explain-for="${r.cve_id}|${r.asset_id}">
      <td colspan="10">
        <div class="explain-collapse"><div class="explain-collapse-inner"><div class="explain-pad"></div></div></div>
      </td>
    </tr>`).join("")}</tbody></table></div>`;
}

function queueTable(data) {
  if (!data.length) return `<p class="empty">The approval queue is clear.</p>`;
  return `<div class="tablewrap"><table><thead><tr><th>CVE</th><th>Asset</th><th>Env</th><th class="num">Risk</th><th class="num">Conf</th><th>Verifier</th><th></th></tr></thead>
  <tbody>${data.map((r, i) => `<tr tabindex="0" class="finding-row" style="animation-delay:${Math.min(i * 14, 260)}ms" data-cve="${r.cve_id}" data-asset="${r.asset_id}" data-approval="${r.approval_id}">
    <td class="mono">${r.cve_id}</td><td>${r.hostname || r.asset_id}</td><td>${r.environment}</td>
    <td class="num">${fmt(r.fused_score)}</td><td class="num">${fmt(r.confidence, 2)}</td>
    <td>${r.verifier_verdict}</td>
    <td><button class="ghost approve" data-approve="${r.approval_id}">Approve</button>
        <button class="ghost reject" data-reject="${r.approval_id}">Reject</button></td>
  </tr>`).join("")}</tbody></table></div>`;
}

function quarantineTable(data) {
  if (!data.length) return `<p class="empty">No records have been rejected at the contract boundary.</p>`;
  return `<div class="tablewrap"><table><thead><tr><th>Source</th><th>Reason</th><th>Detail</th><th>When</th></tr></thead>
  <tbody>${data.map((q, i) => `<tr style="animation-delay:${Math.min(i * 14, 260)}ms"><td>${q.source_id ?? ""}</td><td class="mono">${q.reason}</td>
    <td>${esc((q.detail || "").slice(0, 90))}</td><td class="mono">${(q.quarantined_at || "").slice(0, 19)}</td></tr>`).join("")}</tbody></table></div>`;
}

function playScoreBars(root) {
  root.querySelectorAll(".scorebar i[data-w]").forEach(i => {
    requestAnimationFrame(() => requestAnimationFrame(() => { i.style.width = i.dataset.w + "%"; }));
  });
}

async function loadBoard() {
  const board = $("#board");
  board.innerHTML = `<div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div>`;
  try {
    let html;
    if (view === "queue") html = queueTable(await api("/api/queue"));
    else if (view === "quarantine") html = quarantineTable(await api("/api/quarantine"));
    else html = findingsTable(await api("/api/findings?limit=100" + (view === "chains" ? "&chains_only=true" : "")));
    board.innerHTML = html;
    playScoreBars(board);
  } catch (e) { board.innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
}

function ledger(components) {
  const entries = Object.entries(components || {}).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
  if (!entries.length) return "";
  const max = Math.max(...entries.map(([, v]) => Math.abs(v))) || 1;
  return `<div class="ledger">${entries.map(([k, v]) => {
    const pct = Math.abs(v) / max * 50;
    return `<div class="row"><span class="label">${esc(k.replace(/_/g, " "))}</span>
      <span class="bar"><i class="${v >= 0 ? "up" : "down"}" data-w="${pct}"></i></span>
      <span class="val">${v >= 0 ? "+" : ""}${fmt(v, 2)}</span></div>`;
  }).join("")}</div>`;
}

function playLedgerBars(root) {
  root.querySelectorAll(".bar i[data-w]").forEach(i => {
    requestAnimationFrame(() => requestAnimationFrame(() => { i.style.width = i.dataset.w + "%"; }));
  });
}

/* ============================================================
   EXPLAINER — "what is this / how it hits your systems / how to patch it"
   Prefers real fields from the API (description, cwe, cwe_name, remediation,
   references, plan) when the backend supplies them; falls back to
   generated guidance built from CWE-family knowledge and the finding's
   own risk signals (band, KEV, chain paths, blast radius, environment)
   when it doesn't. Fallback text is explicitly labelled as general guidance.
   ============================================================ */

const CWE_KB = {
  "CWE-79":  { name: "Cross-site scripting", family: "injection",
    patch: ["Encode/escape all untrusted output for the context it renders in (HTML, JS, URL).", "Apply a Content-Security-Policy that blocks inline script execution.", "Upgrade the affected library/template engine to the patched release.", "Re-scan the endpoint with a DAST tool to confirm the payload no longer executes."] },
  "CWE-89":  { name: "SQL injection", family: "injection",
    patch: ["Replace string-concatenated queries with parameterized queries / an ORM.", "Apply the vendor patch or upgrade the affected driver/library.", "Add least-privilege DB credentials for the affected service so a successful injection can't read/write outside its schema.", "Re-test with the original proof-of-concept payload to confirm it now fails."] },
  "CWE-78":  { name: "OS command injection", family: "injection",
    patch: ["Remove shell invocation for user-influenced input; use safe APIs that don't pass through a shell.", "Apply the vendor patch for the affected binary/library.", "Restrict the service account's OS permissions so command execution has minimal blast radius.", "Confirm the fix with a sandboxed replay of the original PoC."] },
  "CWE-22":  { name: "Path traversal", family: "access",
    patch: ["Canonicalize and validate file paths against an allow-list before use.", "Apply the vendor patch or upgrade the affected component.", "Run the service under a restricted filesystem root (chroot/jail/container) as a compensating control.", "Re-test traversal payloads (../, encoded variants) against the patched build."] },
  "CWE-306": { name: "Missing authentication for a critical function", family: "auth",
    patch: ["Require authentication on the affected endpoint/function before deploying anything else.", "Apply the vendor patch that reintroduces the auth check.", "Audit logs for the exposure window to see if the endpoint was hit without credentials.", "Add an authorization test to CI so this can't regress silently."] },
  "CWE-287": { name: "Improper authentication", family: "auth",
    patch: ["Apply the vendor patch fixing the authentication logic.", "Rotate any credentials or tokens that could have been used to bypass the check.", "Enforce MFA on the affected service if not already required.", "Verify the fix by attempting the documented bypass against the patched version."] },
  "CWE-798": { name: "Hard-coded credentials", family: "auth",
    patch: ["Rotate the hard-coded credential immediately — treat it as compromised regardless of exploitation evidence.", "Move secrets to a vault/secrets manager and remove them from source/config/images.", "Apply the vendor patch or rebuild the image once secrets are externalized.", "Add a secret-scanning gate to CI to catch recurrences."] },
  "CWE-502": { name: "Deserialization of untrusted data", family: "injection",
    patch: ["Apply the vendor patch — deserialization bugs are rarely safe to mitigate without a code fix.", "Where possible, switch to a safe/whitelisted deserialization mode.", "Isolate the affected service (network segmentation) until patched.", "Confirm the fix with the original gadget-chain PoC, not just a version check."] },
  "CWE-416": { name: "Use-after-free", family: "memory",
    patch: ["Apply the vendor patch — this class is a memory-safety bug and needs a code fix, not a config change.", "If unpatched, disable or isolate the vulnerable feature/service where feasible.", "Enable exploit-mitigation platform features (ASLR/DEP/CFG) as a compensating control if not already on.", "Re-run the PoC/crash reproducer against the patched build to confirm."] },
  "CWE-787": { name: "Out-of-bounds write", family: "memory",
    patch: ["Apply the vendor patch as the primary fix — this is a memory-corruption class bug.", "Restrict network/process exposure to the vulnerable component until patched.", "Enable available memory-safety mitigations (stack canaries, CFI) as a stopgap.", "Confirm the fix with the original crash input, not just a version bump."] },
  "CWE-352": { name: "Cross-site request forgery", family: "web",
    patch: ["Add CSRF tokens (or re-enable them if disabled) on all state-changing requests.", "Apply the vendor patch or framework upgrade that restores CSRF protection.", "Set SameSite=Strict/Lax cookies on session cookies as a compensating control.", "Verify with a forged-request replay that the action is now rejected."] },
  "CWE-611": { name: "XML external entity (XXE) injection", family: "injection",
    patch: ["Disable external entity resolution in the XML parser configuration.", "Apply the vendor patch/library upgrade.", "Validate/sanitize XML input at the trust boundary.", "Re-test with the original XXE payload against the fixed configuration."] },
};

function pickCwe(a) {
  const id = a.cwe_id || a.cwe;
  if (id && CWE_KB[id]) return { id, ...CWE_KB[id] };
  return null;
}

function bandUrgencyCopy(band, kev) {
  if (kev) return { label: "Patch now", tone: "xurgent", note: "This CVE is on the CISA Known Exploited Vulnerabilities list — treat the timeline as hours, not sprint cycles." };
  if (band === "critical" || band === "high") return { label: "Patch this cycle", tone: "xurgent", note: "Scored high/critical by the fused risk engine — prioritize ahead of routine patch cadence." };
  if (band === "medium") return { label: "Standard cycle", tone: "", note: "Fits the normal patch cadence unless new exploitation evidence (EPSS/KEV) appears." };
  return { label: "Track", tone: "", note: "Low current risk — track for re-scoring if exposure or exploitation evidence changes." };
}

function buildWhat(rec) {
  const a = rec.assessment || {};
  const cwe = pickCwe(a);
  if (a.description) {
    return `<p class="xtext">${esc(a.description)}</p>`;
  }
  const parts = [];
  parts.push(`<b>${esc(a.cve_id)}</b> is scored <b>${esc(a.band)}</b> against <b>${esc(a.asset_id)}</b>${cwe ? ` and maps to <b>${esc(cwe.id)} — ${esc(cwe.name)}</b>` : ""}.`);
  if (a.kev) parts.push(`It is confirmed under active exploitation in the wild (CISA KEV).`);
  if (a.components && a.components.epss !== undefined) parts.push(`The fused score weighs a real-world exploitation-probability signal (EPSS) alongside CVSS severity, not severity alone.`);
  if (!cwe) parts.push(`No CWE mapping is attached to this record yet, so the explanation below is generated from the risk signals rather than the specific vulnerability class — check the vendor advisory for the exact mechanism.`);
  return `<p class="xtext">${parts.join(" ")}</p>`;
}

function buildImpact(rec) {
  const sig = rec.graph_signal || {};
  const a = rec.assessment || {};
  const paths = (sig.paths_json || []).slice(0, 2);
  if (paths.length) {
    return paths.map(p => `
      <div class="pathcard">
        <div class="flow">${p.nodes.map((n, i) => `${i ? '<span class="arrow"></span>' : ""}<span class="node">${esc(n)}</span>`).join("")}</div>
        <div class="pathmeta"><span>feasibility ${fmt(p.feasibility, 2)}</span><span>impact ${fmt(p.impact, 2)}</span>${p.is_sleeper_chain ? '<span class="chainmark">low-severity chain — easy to miss</span>' : ""}</div>
      </div>`).join("") +
      `<p class="xnote">This path comes from the GNN attack-graph engine, not a generic template — it reflects your actual asset topology.</p>`;
  }
  const steps = [];
  steps.push(`An attacker reaches <b>${esc(a.asset_id)}</b> ${a.environment ? `(<b>${esc(a.environment)}</b> environment) ` : ""}via this CVE${a.kev ? ", which is already known to be exploited in the wild" : ""}.`);
  if ((a.blast_radius ?? 0) > 0) steps.push(`From there, the graph engine estimates a blast radius of <b>${a.blast_radius}</b> connected asset(s) that could be reached next if this foothold isn't contained.`);
  else steps.push(`No downstream blast-radius path has been computed for this asset yet — impact below is scoped to this host only.`);
  steps.push(`Because it's scored <b>${esc(a.band)}</b>, treat it as ${a.band === "critical" || a.band === "high" ? "a plausible foothold for further lateral movement" : "lower urgency on its own, but re-check if it later appears in a predicted exploit chain"}.`);
  return `<ol class="xsteps">${steps.map(s => `<li>${s}</li>`).join("")}</ol>
    <p class="xnote">No specific attack-path was returned for this finding, so this is derived from its risk signals rather than a traced graph path.</p>`;
}

function buildPatch(rec) {
  const a = rec.assessment || {};
  const dec = rec.decision || {};
  const cwe = pickCwe(a);
  const urgency = bandUrgencyCopy(a.band, a.kev);
  let stepsHtml = "";
  if (a.remediation) {
    stepsHtml = `<p class="xtext">${esc(a.remediation)}</p>`;
  } else if (dec.plan) {
    const plan = dec.plan;
    const items = [];
    if (plan.summary) items.push(esc(plan.summary));
    if (Array.isArray(plan.steps)) plan.steps.forEach(s => items.push(esc(typeof s === "string" ? s : JSON.stringify(s))));
    if (!items.length) items.push("Review the proposed change payload in the Detail panel — a structured plan is attached but has no step list.");
    stepsHtml = `<ol class="xsteps">${items.map(i => `<li>${i}</li>`).join("")}</ol>`;
  } else if (cwe) {
    stepsHtml = `<ol class="xsteps">${cwe.patch.map(s => `<li>${esc(s)}</li>`).join("")}</ol>`;
  } else {
    const generic = [
      "Confirm the CVE actually applies to the deployed version on this asset (avoid patching blind).",
      a.kev ? "This is a confirmed-exploited CVE — prioritize the vendor patch or emergency mitigation over the normal change window." : "Apply the vendor patch or package update that resolves this CVE.",
      "If a patch isn't available yet, apply the vendor's documented workaround or isolate the asset (network segmentation, disable the affected feature).",
      "Re-scan the asset after the change to confirm the finding clears, and log the fix in the change/rollback record."
    ];
    stepsHtml = `<ol class="xsteps">${generic.map(s => `<li>${s}</li>`).join("")}</ol>
      <p class="xnote">No vendor remediation text or generated plan is attached to this finding yet — these are general steps for this risk band, not a vendor-specific fix. Check the CVE's vendor advisory for exact patch versions.</p>`;
  }
  return `<div class="xcard-head" style="border-bottom:0;background:none;padding-bottom:0">
      <span class="xtag ${urgency.tone}">${esc(urgency.label)}</span>
    </div>
    ${stepsHtml}
    <p class="xnote">${esc(urgency.note)}</p>`;
}

function explainerHtml(rec) {
  return `<div class="explainer">
    <div class="xcard">
      <div class="xcard-head"><span class="xicon what">i</span><span>What this is</span></div>
      <div class="xcard-body">${buildWhat(rec)}</div>
    </div>
    <div class="xcard">
      <div class="xcard-head"><span class="xicon impact">!</span><span>How it could reach your systems</span></div>
      <div class="xcard-body">${buildImpact(rec)}</div>
    </div>
    <div class="xcard">
      <div class="xcard-head"><span class="xicon patch">✓</span><span>How to patch it</span></div>
      <div class="xcard-body">${buildPatch(rec)}</div>
    </div>
  </div>`;
}

async function fetchFullFinding(cve, asset) {
  const key = cve + "|" + asset;
  if (detailCache.has(key)) return detailCache.get(key);
  const rec = await api(`/api/finding/${encodeURIComponent(cve)}/${encodeURIComponent(asset)}`);
  detailCache.set(key, rec);
  return rec;
}

async function toggleExplainRow(triggerRow) {
  const key = triggerRow.dataset.cve + "|" + triggerRow.dataset.asset;
  const explainRow = document.querySelector(`tr.explain-row[data-explain-for="${CSS.escape(key)}"]`);
  if (!explainRow) return;
  const pad = explainRow.querySelector(".explain-pad");
  const opening = !explainRow.classList.contains("show");
  triggerRow.classList.toggle("open", opening);
  explainRow.classList.toggle("show", opening);
  if (opening && !pad.dataset.loaded) {
    pad.innerHTML = `<div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div>`;
    try {
      const rec = await fetchFullFinding(triggerRow.dataset.cve, triggerRow.dataset.asset);
      pad.innerHTML = explainerHtml(rec);
      pad.dataset.loaded = "1";
    } catch (e) {
      pad.innerHTML = `<p class="empty">${esc(e.message)}</p>`;
    }
  }
}

async function loadDetail(cve, asset) {
  const d = $("#detail");
  d.innerHTML = `<h2>Detail</h2><div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div>`;
  try {
    const r = await fetchFullFinding(cve, asset);
    const a = r.assessment, dec = r.decision;
    d.innerHTML = `<h2>Detail</h2>
      <div class="detailbody">
        <h2>Explain this finding</h2>
        ${explainerHtml(r)}
        <h2 style="margin-top:1.2rem">Score composition</h2>
        <div class="card">
          <dl>
            <dt>Finding</dt><dd class="mono">${esc(a.cve_id)} on ${esc(a.asset_id)}</dd>
            <dt>Fused risk</dt><dd class="mono">${fmt(a.fused_score)} <span class="band ${a.band}">${a.band}</span> · CI ${fmt(a.ci_low)}–${fmt(a.ci_high)}</dd>
            <dt>Confidence</dt><dd class="mono">${fmt(a.confidence, 2)}</dd>
            <dt>Remediate by</dt><dd>${a.sla_hours} h from scoring</dd>
            <dt>Decision</dt><dd>${dec ? `${esc(dec.action)} · verifier ${esc(dec.verifier_verdict)} · ${dec.grounded ? "grounded" : "ungrounded"}` : "not yet assessed"}</dd>
          </dl>
        </div>
        <div class="card">${ledger(a.components) || '<p class="empty" style="padding:0">No evidence trail recorded.</p>'}</div>
        ${dec?.rationale ? `<h2>Analyst model</h2><div class="rationale">${esc(dec.rationale)}</div>` : ""}
        ${dec?.plan ? `<h2>Proposed change (raw)</h2><div class="rationale">${esc(JSON.stringify(dec.plan, null, 2))}</div>` : ""}
      </div>`;
    playLedgerBars(d);
  } catch (e) { d.innerHTML = `<h2>Detail</h2><p class="empty">${esc(e.message)}</p>`; }
}

document.addEventListener("click", async (e) => {
  const tab = e.target.closest(".tabs button");
  if (tab) {
    view = tab.dataset.view;
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-current", b === tab));
    moveTabIndicator(tab);
    return loadBoard();
  }

  const expandToggle = e.target.closest("[data-explain-toggle]");
  if (expandToggle) {
    e.stopPropagation();
    const row = expandToggle.closest("tr.finding-row");
    if (row) toggleExplainRow(row);
    return;
  }

  const expandAll = e.target.closest("#expandAll");
  if (expandAll) {
    const rows = document.querySelectorAll("tbody tr.finding-row");
    const anyClosed = Array.from(rows).some(r => !r.classList.contains("open"));
    expandAll.textContent = anyClosed ? "Collapse all ▴" : "Explain all ▾";
    rows.forEach(r => { if (anyClosed ? !r.classList.contains("open") : r.classList.contains("open")) toggleExplainRow(r); });
    return;
  }

  const approve = e.target.dataset.approve, reject = e.target.dataset.reject;
  if (approve || reject) {
    e.stopPropagation();
    const analyst = prompt("Your name for the audit log:");
    if (!analyst) return;
    try {
      await api(`/api/queue/${approve || reject}`, {
        method: "POST",
        body: JSON.stringify({ approve: Boolean(approve), analyst, reason: "" })
      });
      toast(approve ? "Approved. The bundle goes to your change pipeline." : "Rejected. Logged as an override.");
      await loadBoard(); await loadOverview();
    } catch (err) { toast(err.message); }
    return;
  }

  const row = e.target.closest("tbody tr.finding-row");
  if (row?.dataset.cve) {
    document.querySelectorAll("tbody tr.finding-row").forEach(r => r.setAttribute("aria-selected", r === row));
    selected = row.dataset;
    loadDetail(row.dataset.cve, row.dataset.asset);
  }
});

document.addEventListener("keydown", (e) => {
  const row = e.target.closest?.("tbody tr.finding-row");
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); row.click(); }
});

$("#connect").addEventListener("click", async () => {
  token = $("#token").value.trim();
  sessionStorage.setItem("raven_token", token);
  try { await loadOverview(); await loadBoard(); toast("Connected."); }
  catch (e) { $("#livedot").classList.remove("live"); $("#livetext").textContent = "offline"; toast(e.message); }
});

window.addEventListener("resize", () => moveTabIndicator(document.querySelector(".tabs button[aria-current=true]")));

if (token) {
  $("#token").value = token;
  loadOverview().then(loadBoard).catch(() => { $("#livedot").classList.remove("live"); $("#livetext").textContent = "offline"; });
}
requestAnimationFrame(() => moveTabIndicator(document.querySelector(".tabs button[aria-current=true]")));
setInterval(() => { if (token) loadOverview().catch(() => {}); }, 20000);
</script>
</body>
</html>
