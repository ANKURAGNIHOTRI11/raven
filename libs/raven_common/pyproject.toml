[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raven-common"
version = "1.0.0"
description = "Shared contracts, bus, storage and telemetry for the RAVEN platform"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "aiokafka>=0.10.0",
  "cramjam>=2.8",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "orjson>=3.10",
  "tenacity>=8.2",
  "minio>=7.2",
  "redis>=5.0",
]

[tool.setuptools.packages.find]
include = ["raven_common*"]
