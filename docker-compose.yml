# RAVEN - full stack. Everything runs in containers; the only host
# requirements are Docker, the NVIDIA Container Toolkit and a working driver.
#
#   make up        build base images, start the platform
#   make gpu-check confirm the H200 is visible inside a container
#   make logs      follow everything
#
# GPU sharing: vLLM, the embedder, the normalizer's BERT pass and the GNN all
# target device 0. vLLM is capped at 72% of VRAM so the other three fit
# alongside it on a single 141 GB H200. Raise RAVEN_VLLM_GPU_FRAC only if you
# move the smaller models off the card.

x-common: &common
  restart: unless-stopped
  networks: [raven]
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

# Explicit environment allow-lists: the secret-bearing .env is used for Compose
# interpolation but is NOT injected wholesale into every container.
x-app-env: &app_env
  RAVEN_KAFKA_BOOTSTRAP: redpanda:9092
  RAVEN_LOG_LEVEL: ${RAVEN_LOG_LEVEL:-INFO}
  RAVEN_METRICS_PORT: ${RAVEN_METRICS_PORT:-9100}

x-db-env: &db_env
  <<: *app_env
  RAVEN_PG_DSN: ${RAVEN_PG_DSN:?Run make env to generate the local .env}

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${RAVEN_GPU_DEVICE:-0}"]
            capabilities: [gpu]

networks:
  raven:
    driver: bridge
  sandbox_net:
    driver: bridge
    internal: true          # the patch sandbox has no route anywhere

volumes:
  pgdata: {}
  neo4jdata: {}
  osdata: {}
  qdrantdata: {}
  miniodata: {}
  redpandadata: {}
  models: {}
  artefacts: {}
  promdata: {}
  grafanadata: {}

services:
  # ------------------------------------------------------------- data plane
  redpanda:
    <<: *common
    image: redpandadata/redpanda:v24.2.12
    command:
      - redpanda start
      - --smp 2
      - --memory 2G
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
    volumes: [redpandadata:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    <<: *common
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raven}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env to generate the local .env}
      POSTGRES_DB: ${POSTGRES_DB:-raven}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raven}"]
      interval: 10s
      retries: 12

  neo4j:
    <<: *common
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: "${RAVEN_NEO4J_USER:-neo4j}/${RAVEN_NEO4J_PASSWORD:?Run make env to generate the local .env}"
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 2G
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes: [neo4jdata:/data]
    ports: ["${RAVEN_BIND_ADDRESS:-127.0.0.1}:${RAVEN_NEO4J_HTTP_PORT:-7474}:7474", "${RAVEN_BIND_ADDRESS:-127.0.0.1}:${RAVEN_NEO4J_BOLT_PORT:-7687}:7687"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 15s
      retries: 20

  opensearch:
    <<: *common
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes: [osdata:/usr/share/opensearch/data]

  qdrant:
    <<: *common
    # v1.12.4 crashes on boot on Grace/aarch64 hosts with 64KB pages
    # ("<jemalloc>: Unsupported system page size") - fixed upstream in
    # v1.19.0, which bundles jemalloc 5.3.1 with aarch64 large-page support
    # (qdrant/qdrant#4298, fixed via jemalloc/jemalloc#2624+#2628). Do not
    # downgrade below v1.19.0 on this host.
    image: qdrant/qdrant:v1.19.0
    volumes: [qdrantdata:/qdrant/storage]

  minio:
    <<: *common
    # MinIO Inc. stopped publishing Docker images/binaries for the community
    # edition in Oct 2025 and archived the source repo in 2026, so
    # minio/minio:* tags are gone from Docker Hub. pgsty/minio is a
    # community-maintained fork (SILO, github.com/pgsty/minio) that continues
    # publishing CVE-patched builds under the same RELEASE.<date> tag scheme
    # and is a drop-in replacement — same env vars, same command, same S3 API
    # and object-lock/WORM support. Pin and bump this tag deliberately.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${RAVEN_MINIO_ACCESS_KEY:-raven}
      MINIO_ROOT_PASSWORD: ${RAVEN_MINIO_SECRET_KEY:?Run make env to generate the local .env}
    volumes: [miniodata:/data]
    ports: ["${RAVEN_BIND_ADDRESS:-127.0.0.1}:${RAVEN_MINIO_CONSOLE_PORT:-9001}:9001"]

  redis:
    <<: *common
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]

  # ------------------------------------------------------------ model plane
  vllm:
    <<: [*common, *gpu]
    # Official vLLM publishes a multi-architecture release image. Set
    # RAVEN_VLLM_IMAGE only if intentionally using a custom local build.
    image: ${RAVEN_VLLM_IMAGE:-vllm/vllm-openai:v0.32.0-cu129}
    command:
      - --model=${RAVEN_VLLM_MODEL:-Qwen/Qwen2.5-32B-Instruct-AWQ}
      - --served-model-name=${RAVEN_VLLM_MODEL:-Qwen/Qwen2.5-32B-Instruct-AWQ}
      - --max-model-len=${RAVEN_VLLM_MAX_LEN:-16384}
      - --gpu-memory-utilization=${RAVEN_VLLM_GPU_FRAC:-0.72}
      - --enable-prefix-caching
      - --disable-log-requests
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_HOME: /models
    volumes: [models:/models]
    ipc: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 900s

  embedder:
    <<: [*common, *gpu]
    build: {context: ., dockerfile: services/embedder/Dockerfile}
    image: raven/embedder:1.0
    environment:
      <<: *app_env
      RAVEN_EMBEDDING_MODEL: ${RAVEN_EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
    volumes: [models:/models]
    depends_on: [qdrant]

  # --------------------------------------------------------------- pipeline
  crawler:
    <<: *common
    build: {context: ., dockerfile: services/crawler/Dockerfile}
    image: raven/crawler:1.0
    environment:
      <<: *db_env
      RAVEN_NVD_API_KEY: ${RAVEN_NVD_API_KEY:-}
      RAVEN_GITHUB_TOKEN: ${RAVEN_GITHUB_TOKEN:-}
      RAVEN_OTX_API_KEY: ${RAVEN_OTX_API_KEY:-}
      RAVEN_MINIO_ENDPOINT: minio:9000
      RAVEN_MINIO_ACCESS_KEY: ${RAVEN_MINIO_ACCESS_KEY:-raven}
      RAVEN_MINIO_SECRET_KEY: ${RAVEN_MINIO_SECRET_KEY:?Run make env to generate the local .env}
      RAVEN_CMDB_SEED_PATH: ${RAVEN_CMDB_SEED_PATH:-/seed/assets.json}
      RAVEN_FEED_LOOKBACK_DAYS: ${RAVEN_FEED_LOOKBACK_DAYS:-7}
      RAVEN_CRAWL_INTERVAL_SECONDS: ${RAVEN_CRAWL_INTERVAL_SECONDS:-3600}
      RAVEN_CRAWL_CONCURRENCY: ${RAVEN_CRAWL_CONCURRENCY:-8}
      RAVEN_HARVEST_TIMEOUT: ${RAVEN_HARVEST_TIMEOUT:-300}
    volumes: ["./seed:/seed:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      minio: {condition: service_started}

  telegram-watcher:
    <<: *common
    build: {context: ., dockerfile: services/telegram_watcher/Dockerfile}
    image: raven/telegram-watcher:1.0
    environment:
      <<: *db_env
      RAVEN_MINIO_ENDPOINT: minio:9000
      RAVEN_MINIO_ACCESS_KEY: ${RAVEN_MINIO_ACCESS_KEY:-raven}
      RAVEN_MINIO_SECRET_KEY: ${RAVEN_MINIO_SECRET_KEY:?Run make env to generate the local .env}
      RAVEN_TELEGRAM_API_ID: ${RAVEN_TELEGRAM_API_ID:-}
      RAVEN_TELEGRAM_API_HASH: ${RAVEN_TELEGRAM_API_HASH:-}
      RAVEN_TELEGRAM_SESSION: ${RAVEN_TELEGRAM_SESSION:-}
      RAVEN_TELEGRAM_CHANNELS: ${RAVEN_TELEGRAM_CHANNELS:-}
    # Idles harmlessly (see main.py) if RAVEN_TELEGRAM_API_ID/HASH/SESSION
    # or RAVEN_TELEGRAM_CHANNELS are unset - safe to leave in the stack.
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      minio: {condition: service_started}

  normalizer:
    <<: [*common, *gpu]
    build: {context: ., dockerfile: services/normalizer/Dockerfile}
    image: raven/normalizer:1.0
    environment:
      <<: *db_env
      RAVEN_OPENSEARCH_URL: http://opensearch:9200
      RAVEN_CLASSIFIER_MODEL: ${RAVEN_CLASSIFIER_MODEL:-distilbert-base-uncased}
      RAVEN_HF_HOME: /models
    volumes: [models:/models]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}

  graph-builder:
    <<: *common
    build: {context: ., dockerfile: services/graph_builder/Dockerfile}
    image: raven/graph-builder:1.0
    environment:
      <<: *app_env
      RAVEN_NEO4J_URI: bolt://neo4j:7687
      RAVEN_NEO4J_USER: ${RAVEN_NEO4J_USER:-neo4j}
      RAVEN_NEO4J_PASSWORD: ${RAVEN_NEO4J_PASSWORD:?Run make env to generate the local .env}
      RAVEN_QDRANT_URL: http://qdrant:6333
      RAVEN_EMBEDDING_MODEL: ${RAVEN_EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
    depends_on:
      neo4j: {condition: service_healthy}
      redpanda: {condition: service_healthy}

  gnn-engine:
    <<: [*common, *gpu]
    build: {context: ., dockerfile: services/gnn_engine/Dockerfile}
    image: raven/gnn-engine:1.0
    environment:
      <<: *db_env
      RAVEN_NEO4J_URI: bolt://neo4j:7687
      RAVEN_NEO4J_USER: ${RAVEN_NEO4J_USER:-neo4j}
      RAVEN_NEO4J_PASSWORD: ${RAVEN_NEO4J_PASSWORD:?Run make env to generate the local .env}
      RAVEN_GNN_RECOMPUTE_SECONDS: ${RAVEN_GNN_RECOMPUTE_SECONDS:-300}
      RAVEN_GNN_CKPT_DIR: /models/gnn
    volumes: [models:/models]
    depends_on:
      neo4j: {condition: service_healthy}
      redpanda: {condition: service_healthy}

  risk-engine:
    <<: *common
    build: {context: ., dockerfile: services/risk_engine/Dockerfile}
    image: raven/risk-engine:1.0
    environment:
      <<: *db_env
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}

  llm-gateway:
    <<: *common
    build: {context: ., dockerfile: services/llm_gateway/Dockerfile}
    image: raven/llm-gateway:1.0
    environment:
      <<: *app_env
      RAVEN_QDRANT_URL: http://qdrant:6333
      RAVEN_VLLM_BASE_URL: http://vllm:8000/v1
      RAVEN_VLLM_MODEL: ${RAVEN_VLLM_MODEL:-Qwen/Qwen2.5-32B-Instruct-AWQ}
      RAVEN_VERIFIER_BASE_URL: http://vllm:8000/v1
      RAVEN_VERIFIER_MODEL: ${RAVEN_VERIFIER_MODEL:-Qwen/Qwen2.5-32B-Instruct-AWQ}
    depends_on: [qdrant, embedder]

  agents:
    <<: *common
    build: {context: ., dockerfile: services/agents/Dockerfile}
    image: raven/agents:1.0
    environment:
      <<: *db_env
      RAVEN_AUTONOMY_CONFIDENCE_THRESHOLD: ${RAVEN_AUTONOMY_CONFIDENCE_THRESHOLD:-0.85}
      RAVEN_AUTONOMY_MAX_BLAST_RADIUS: ${RAVEN_AUTONOMY_MAX_BLAST_RADIUS:-3}
      RAVEN_ABSTAIN_CONFIDENCE_FLOOR: ${RAVEN_ABSTAIN_CONFIDENCE_FLOOR:-0.55}
    networks: [raven, sandbox_net]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}

  sandbox:
    <<: *common
    build: {context: ., dockerfile: services/sandbox/Dockerfile}
    image: raven/sandbox:1.0
    networks: [sandbox_net]
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g

  remediation:
    <<: *common
    build: {context: ., dockerfile: services/remediation/Dockerfile}
    image: raven/remediation:1.0
    environment:
      <<: *db_env
      RAVEN_APPLY_HOOK: ${RAVEN_APPLY_HOOK:-}
      RAVEN_ARTEFACT_DIR: /artefacts
    volumes: [artefacts:/artefacts]
    depends_on:
      postgres: {condition: service_healthy}

  feedback:
    <<: *common
    build: {context: ., dockerfile: services/feedback/Dockerfile}
    image: raven/feedback:1.0
    environment:
      <<: *db_env
      RAVEN_RETRAIN_AFTER_LABELS: ${RAVEN_RETRAIN_AFTER_LABELS:-200}
      RAVEN_MODEL_TRUST_FLOOR: ${RAVEN_MODEL_TRUST_FLOOR:-0.55}
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *common
    build: {context: ., dockerfile: services/api/Dockerfile}
    image: raven/api:1.0
    environment:
      <<: *db_env
      RAVEN_API_TOKEN: ${RAVEN_API_TOKEN:?Run make env to generate the local .env}
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}

  # ---------------------------------------------------------- observability
  prometheus:
    <<: *common
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    <<: *common
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${RAVEN_GRAFANA_PASSWORD:?Run make env to generate the local .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

  nginx:
    <<: *common
    image: nginx:1.27-alpine
    volumes: ["./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["${RAVEN_BIND_ADDRESS:-127.0.0.1}:${RAVEN_HTTP_PORT:-8088}:8088"]
    depends_on: [api, grafana]
